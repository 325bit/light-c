[package]
name = "LightC"
version = "2.19.1"
description = "Windows C盘智能清理工具"
authors = ["Evan Lau"]
edition = "2021"
license-file = "../LICENSE"
# Distributed under a custom license and never published to crates.io. Declaring
# this explicitly is what lets cargo-deny's licenses.private treat the package as
# a private crate and skip the license check for it.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cleanup_c_lib"
# rlib only: this is a Windows-desktop-only app, so the staticlib (iOS) and
# cdylib (Android) artifacts from the create-tauri-app template are never
# consumed by anything and only slow down linking.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# 2.14.1 is the first release that depends on zip ^9. Every 2.10-2.14.0 release
# still resolves zip ^4, which carries six RUSTSEC advisories (symlink escape,
# SUID bit preservation, unverified AES auth code, ...), so there is no smaller
# step that clears them.
# Do NOT re-enable its "native-tls" feature: the default "rustls-tls" already
# covers HTTPS, and enabling both stacks used to link native-tls + openssl-sys
# alongside rustls (two complete TLS implementations in the binary).
tauri-plugin-updater = "2.14.1"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.3"
# reqwest 0.13 renamed the `rustls-tls` feature to `rustls`, and the 0.13 line is
# what tauri-plugin-updater 2.14 links against. Staying on 0.12 would compile two
# copies of the whole hyper/tower TLS stack into the binary.
reqwest = { version = "0.13", features = ["json", "rustls"] }

# Filesystem operations
walkdir = "2"              # Recursive directory walking
jwalk = "0.8"              # Parallel directory walking (caches metadata on Windows 11)
glob = "0.3"               # Glob pattern expansion
# Async runtime. "full" used to pull io / fs / net / process / signal that this
# crate never touches; the features below are the complete set actually used:
#   rt      -- tokio::spawn / tokio::task::spawn_blocking
#   macros  -- tokio::join!
#   sync    -- tokio::sync::Mutex
#   time    -- tokio::time::timeout
# The multi-threaded runtime itself is created by tauri (which enables
# rt-multi-thread for us); we only call into an existing runtime.
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
# Date and time
chrono = { version = "0.4", features = ["serde"] }
# Windows system APIs. H4 unified all bindings on this crate (0.62 matches the
# Tauri stack, so only one copy compiles); the legacy 0.3 bindings were removed
# once the last one moved over. Feature additions must name the API that needs
# them; never switch to features = ["all"] (compile-time cost, and it reverses
# the dependency-narrowing direction of M12).
windows = { version = "0.62", features = [
    "Win32_Foundation",                # HANDLE / CloseHandle / GetLastError / LocalFree / WIN32_ERROR
    "Win32_Storage_FileSystem",        # GetFileAttributesW / SetFileAttributesW / MoveFileExW /
                                       # CreateFileW / GetDiskFreeSpaceExW / GetDiskFreeSpaceW /
                                       # GetDriveTypeW / GetLogicalDrives / GetVolumeInformationW
    "Win32_Security",                  # GetTokenInformation / AllocateAndInitializeSid / FreeSid /
                                       # TOKEN_USER / TokenUser / GetSecurityDescriptorDacl|Owner|Group
    "Win32_Security_Authorization",    # GetSecurityInfo / SetSecurityInfo / SetEntriesInAclW /
                                       # ConvertSidToStringSidW / TRUSTEE_W / EXPLICIT_ACCESS_W
    "Win32_Security_Cryptography",     # CryptProtectData / CryptUnprotectData / CRYPT_INTEGER_BLOB
    "Win32_System_Threading",          # GetCurrentProcess / OpenProcessToken
    "Win32_System_SystemInformation",  # GetSystemInfo / GlobalMemoryStatusEx / GetTickCount64
    "Win32_System_IO",                 # DeviceIoControl
    "Win32_System_Services",           # OpenSCManagerW / OpenServiceW / QueryServiceStatus
    "Win32_System_Com",                # Windows Search index rebuild (COM)
    "Win32_System_Search",             # CSearchManager / ISearchManager / catalog status
    "Win32_Globalization",             # MultiByteToWideChar / GetOEMCP / CP_ACP / CP_UTF8
    "Win32_UI_Shell",                  # ShellExecuteW / SHChangeNotify / SHLoadIndirectString
    "Win32_UI_WindowsAndMessaging",    # SW_SHOWNORMAL
    "Win32_System_WindowsProgramming", # DRIVE_FIXED
] }
# Windows registry access
winreg = "0.55"
# Logging
log = "0.4"
env_logger = "0.11"
# Parallelism
rayon = "1.10"
num_cpus = "1.16"
tauri-plugin-process = "2.3.1"
# Aligned with what tauri-plugin-updater 2.14 requires, so only one copy of the
# crate is linked. The 6 -> 7 bump is an MSRV/dependency refresh; the functions
# used here (home_dir, data_dir, data_local_dir, document_dir) are unchanged.
dirs = "7.0.0"
# Regex matching (filtering uninstall-leftover names and versions)
regex = "1"
quick-xml = "0.42"

[dev-dependencies]
# Benchmarks. Default features are deliberately disabled and only
# cargo_bench_support is kept: the defaults pull in plotters (chart rendering) and
# rayon (parallel analysis) along with a dozen extra crates, and since
# `cargo clippy --all-targets` checks benches too, that would slow CI down.
# All we need here is timing numbers, not charts.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

# Benchmark entry point. harness = false means Rust's built-in test harness is not
# used and criterion provides its own main.
[[bench]]
name = "path_checks"
harness = false

# ============================================================================
# Lint levels: promote "must fix" lints to compile errors, leave the rest as warnings
#
# Configured in Cargo.toml rather than on the CI command line because cargo check /
# cargo clippy / rust-analyzer all read the same config -- that is the only way
# local and CI results agree.
#
# Rolled out in stages: the baseline when this was added was 125 warnings, so a
# blanket `-D warnings` would make the gate red on day one. The two groups that are
# essentially bugs are denied right away:
#   correctness -- the code almost certainly does not do what it looks like
#                  (e.g. abs() overflow, cloning a Copy type)
#   suspicious  -- structurally likely a mistake (e.g. items after a test module)
# The remaining style / perf / complexity warnings get cleaned up category by
# category, adding each group here once it is at zero, and switching to
# `all = "deny"` once everything is clear.
# ============================================================================
[lints.clippy]
correctness = "deny"
suspicious = "deny"

# Enable opt-level 1 for dev builds.
#
# The default dev profile (opt-level = 0) makes CPU-bound scanning and parsing 4-5x slower
# (measured here: MFT post-processing 686ms -> 3377ms). Benchmarking dev builds would give
# completely wrong conclusions, so use level 1: runtime is well above half of release speed
# with almost no extra compile time.
[profile.dev]
opt-level = 1
