[package]
name = "LightC"
version = "2.19.1"
description = "Windows C盘智能清理工具"
authors = ["Evan Lau"]
edition = "2021"
license-file = "../LICENSE"
# Distributed under a custom license and never published to crates.io. Declaring
# this explicitly is what lets cargo-deny's licenses.private treat the package as
# a private crate and skip the license check for it.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cleanup_c_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# 2.14.1 is the first release that depends on zip ^9. Every 2.10-2.14.0 release
# still resolves zip ^4, which carries six RUSTSEC advisories (symlink escape,
# SUID bit preservation, unverified AES auth code, ...), so there is no smaller
# step that clears them.
tauri-plugin-updater = { version = "2.14.1", features = ["native-tls"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.3"
# reqwest 0.13 renamed the `rustls-tls` feature to `rustls`, and the 0.13 line is
# what tauri-plugin-updater 2.14 links against. Staying on 0.12 would compile two
# copies of the whole hyper/tower TLS stack into the binary.
reqwest = { version = "0.13", features = ["json", "rustls"] }

# 文件系统操作
walkdir = "2"              # 递归遍历目录
jwalk = "0.8"              # 并行目录遍历（Win11 下缓存 metadata）
glob = "0.3"               # 通配符路径展开
# 异步运行时
tokio = { version = "1", features = ["full"] }
# 日期时间处理
chrono = { version = "0.4", features = ["serde"] }
# Windows系统API
winapi = { version = "0.3", features = ["fileapi", "winbase", "handleapi", "errhandlingapi", "sysinfoapi", "processenv", "ioapiset", "winnt", "processthreadsapi", "securitybaseapi", "sddl", "aclapi", "accctrl", "shellapi", "winuser", "stringapiset", "winnls", "winsvc", "dpapi", "wincrypt"] }
# Windows 搜索索引重建（COM 接口），复用 tauri 已引入的 windows crate 版本
windows = { version = "0.61", features = ["Win32_System_Search", "Win32_System_Com", "Win32_Foundation"] }
# Windows注册表操作
winreg = "0.55"
# 日志
log = "0.4"
env_logger = "0.11"
# 并行处理
rayon = "1.10"
num_cpus = "1.16"
tauri-plugin-process = "2.3.1"
# Aligned with what tauri-plugin-updater 2.14 requires, so only one copy of the
# crate is linked. The 6 -> 7 bump is an MSRV/dependency refresh; the functions
# used here (home_dir, data_dir, data_local_dir, document_dir) are unchanged.
dirs = "7.0.0"
# 单例模式
once_cell = "1.19"
# 正则匹配（卸载残留包名/版本号过滤）
regex = "1"
quick-xml = "0.42"

[dev-dependencies]
# Benchmarks. Default features are deliberately disabled and only
# cargo_bench_support is kept: the defaults pull in plotters (chart rendering) and
# rayon (parallel analysis) along with a dozen extra crates, and since
# `cargo clippy --all-targets` checks benches too, that would slow CI down.
# All we need here is timing numbers, not charts.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

# Benchmark entry point. harness = false means Rust's built-in test harness is not
# used and criterion provides its own main.
[[bench]]
name = "path_checks"
harness = false

# ============================================================================
# Lint levels: promote "must fix" lints to compile errors, leave the rest as warnings
#
# Configured in Cargo.toml rather than on the CI command line because cargo check /
# cargo clippy / rust-analyzer all read the same config -- that is the only way
# local and CI results agree.
#
# Rolled out in stages: the baseline when this was added was 125 warnings, so a
# blanket `-D warnings` would make the gate red on day one. The two groups that are
# essentially bugs are denied right away:
#   correctness -- the code almost certainly does not do what it looks like
#                  (e.g. abs() overflow, cloning a Copy type)
#   suspicious  -- structurally likely a mistake (e.g. items after a test module)
# The remaining style / perf / complexity warnings get cleaned up category by
# category, adding each group here once it is at zero, and switching to
# `all = "deny"` once everything is clear.
# ============================================================================
[lints.clippy]
correctness = "deny"
suspicious = "deny"

# 开发构建开一级优化。
#
# 默认的 dev profile 是 opt-level = 0，扫描、解析这类纯 CPU 代码会慢 4-5 倍
# （本项目实测：MFT 后处理 686ms → 3377ms）。在 dev 里测性能会得出完全错误的结论，
# 所以这里只开 1 级：运行时接近 release 的一半以上，编译时间几乎不变。
[profile.dev]
opt-level = 1
