# ============================================================================
# LightC automated release workflow
# Automatically builds and publishes to GitHub Releases when a tag (v*) is pushed
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release metadata from Chinese changelog
        id: release_metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ChangelogPath = "CHANGELOG-zh.md"
          if (-not (Test-Path $ChangelogPath)) {
            Write-Host "Error: changelog not found: $ChangelogPath" -ForegroundColor Red
            exit 1
          }

          $ChangelogLines = Get-Content -Path $ChangelogPath -Encoding utf8
          $Version = $null
          $VersionHeaderIndex = -1
          for ($Index = 0; $Index -lt $ChangelogLines.Count; $Index++) {
            if ($ChangelogLines[$Index] -match '^## v(\d+\.\d+\.\d+)\s*$') {
              $Version = $Matches[1]
              $VersionHeaderIndex = $Index
              break
            }
          }

          if (-not $Version) {
            Write-Host "Error: no versioned section found in $ChangelogPath" -ForegroundColor Red
            exit 1
          }

          # Release notes use the latest version section of the Chinese CHANGELOG, but strip list markers to keep the Release as plain text.
          $ReleaseLines = @("LightC v$Version 发布说明")
          for ($Index = $VersionHeaderIndex + 1; $Index -lt $ChangelogLines.Count; $Index++) {
            $Line = $ChangelogLines[$Index]
            if ($Line -match '^##\s+') {
              break
            }
            if ([string]::IsNullOrWhiteSpace($Line)) {
              continue
            }
            $ReleaseLines += ($Line -replace '^\s*-\s+', '')
          }

          if ($ReleaseLines.Count -le 1) {
            Write-Host "Error: latest changelog section is empty" -ForegroundColor Red
            exit 1
          }

          $TagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($TagVersion -ne $Version) {
            Write-Host "Error: tag version v$TagVersion does not match changelog version v$Version" -ForegroundColor Red
            exit 1
          }

          $ReleaseBody = $ReleaseLines -join "`n"
          $OutputDelimiter = "RELEASE_BODY_$([guid]::NewGuid().ToString('N'))"
          "version=$Version" >> $env:GITHUB_OUTPUT
          "release_name=LightC v$Version" >> $env:GITHUB_OUTPUT
          "release_body<<$OutputDelimiter" >> $env:GITHUB_OUTPUT
          $ReleaseBody >> $env:GITHUB_OUTPUT
          $OutputDelimiter >> $env:GITHUB_OUTPUT
          Write-Host ("Release metadata loaded from {0}: v{1}" -f $ChangelogPath, $Version) -ForegroundColor Green

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.release_metadata.outputs.release_name }}
          releaseBody: ${{ steps.release_metadata.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Create normal installer exe signature
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ReleaseExe = "src-tauri\target\release\LightC.exe"
          $PreservedInstallerExe = "LightC_installer_runtime.exe"

          if (-not (Test-Path $ReleaseExe)) {
            Write-Host "Error: normal installer runtime LightC.exe not found" -ForegroundColor Red
            exit 1
          }

          # Must sign before the second build of the WebView2 offline package; the subsequent tauri build overwrites target\release\LightC.exe.
          Copy-Item $ReleaseExe $PreservedInstallerExe -Force
          $SignatureOutput = npx tauri signer sign $ReleaseExe
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: installer exe signing failed" -ForegroundColor Red
            exit $LASTEXITCODE
          }
          $GeneratedSigPath = "$ReleaseExe.sig"
          if (Test-Path $GeneratedSigPath) {
            $SignatureText = Get-Content -Raw -Path $GeneratedSigPath
            if ($SignatureText.TrimStart().StartsWith("untrusted comment:")) {
              $SignatureBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($SignatureText))
            } else {
              $SignatureBase64 = $SignatureText.Trim()
            }
          } else {
            $SignatureBase64 = ($SignatureOutput -split "`r?`n" | Where-Object { $_ -match '^[A-Za-z0-9+/=]+$' } | Select-Object -Last 1)
            if (-not $SignatureBase64) {
              Write-Host "Error: installer exe signature output not found" -ForegroundColor Red
              exit 1
            }
          }

          $SignatureBase64 | Out-File -FilePath "LightC_installer_exe.sig" -Encoding utf8 -NoNewline
          Write-Host "  Created: LightC_installer_exe.sig" -ForegroundColor Green

      # tauri-action has already created the Release and uploaded the NSIS installer
      # The following additional steps package the WebView2 offline installer and portable build and upload them to the same Release

      - name: Create WebView2 offline installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ConfigPath = "tauri.webview2-offline.conf.json"
          # External release assets include the version number; internal runtime files keep the name LightC.exe, to avoid breaking integrity checks and runtime path detection.
          $OutputName = "LightC_webview2_offline_x64_v$env:RELEASE_VERSION.exe"

          Write-Host "Creating WebView2 offline installer..." -ForegroundColor Cyan

          $OfflineConfig = @{
            bundle = @{
              createUpdaterArtifacts = $false
              windows = @{
                webviewInstallMode = @{
                  type = "offlineInstaller"
                  silent = $true
                }
                nsis = @{
                  installerHooks = "nsis/installer-hooks-webview2-offline.nsh"
                }
              }
            }
          }
          $OfflineConfig | ConvertTo-Json -Depth 8 | Out-File -FilePath $ConfigPath -Encoding utf8

          npx tauri build --bundles nsis --config $ConfigPath
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: WebView2 offline installer build failed" -ForegroundColor Red
            exit $LASTEXITCODE
          }

          $Installer = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $Installer) {
            Write-Host "Error: NSIS installer not found" -ForegroundColor Red
            exit 1
          }

          Copy-Item $Installer.FullName $OutputName -Force
          Write-Host "  Created: $OutputName" -ForegroundColor Green

          $OfflineRuntimeExe = "src-tauri\target\release\LightC.exe"
          if (-not (Test-Path $OfflineRuntimeExe)) {
            Write-Host "Error: WebView2 offline runtime LightC.exe not found" -ForegroundColor Red
            exit 1
          }

          $SignatureOutput = npx tauri signer sign $OfflineRuntimeExe
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: WebView2 offline exe signing failed" -ForegroundColor Red
            exit $LASTEXITCODE
          }
          $GeneratedSigPath = "$OfflineRuntimeExe.sig"
          if (Test-Path $GeneratedSigPath) {
            $SignatureText = Get-Content -Raw -Path $GeneratedSigPath
            if ($SignatureText.TrimStart().StartsWith("untrusted comment:")) {
              $SignatureBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($SignatureText))
            } else {
              $SignatureBase64 = $SignatureText.Trim()
            }
          } else {
            $SignatureBase64 = ($SignatureOutput -split "`r?`n" | Where-Object { $_ -match '^[A-Za-z0-9+/=]+$' } | Select-Object -Last 1)
            if (-not $SignatureBase64) {
              Write-Host "Error: WebView2 offline exe signature output not found" -ForegroundColor Red
              exit 1
            }
          }

          $SignatureBase64 | Out-File -FilePath "LightC_webview2_offline_exe.sig" -Encoding utf8 -NoNewline
          Write-Host "  Created: LightC_webview2_offline_exe.sig" -ForegroundColor Green
          echo "webview2_offline_installer=$OutputName" >> $env:GITHUB_OUTPUT
        id: webview2_offline

      - name: Create portable package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ReleaseDir = "src-tauri\target\release"
          $PortableDir = "portable_temp"
          # The archive includes the version number; inside it the file is still LightC.exe, keeping the signing target and portable-mode detection unchanged.
          $ZipName = "LightC_portable_x64_v$env:RELEASE_VERSION.zip"
          $PreservedInstallerExe = "LightC_installer_runtime.exe"

          Write-Host "Creating portable package..." -ForegroundColor Cyan

          New-Item -ItemType Directory -Path $PortableDir -Force | Out-Null

          # Main program
          $PortableSourceExe = if (Test-Path $PreservedInstallerExe) { $PreservedInstallerExe } else { "$ReleaseDir\LightC.exe" }
          if (-not (Test-Path $PortableSourceExe)) {
            Write-Host "Error: LightC.exe not found" -ForegroundColor Red
            exit 1
          }
          # The portable build uses the same runtime exe as the regular installer, to avoid the exe from the second WebView2 offline build being wrongly packed into the portable archive.
          Copy-Item $PortableSourceExe "$PortableDir\LightC.exe" -Force
          Write-Host "  Copied: LightC.exe" -ForegroundColor White

          # The old marker is kept for old-version compatibility; new versions also read the schema-bearing manifest to decide the data directory layout.
          Set-Content -Path "$PortableDir\LightC.portable" -Value "portable" -Encoding UTF8
          Write-Host "  Created: LightC.portable" -ForegroundColor White
          $PortableManifest = [ordered]@{
            schema_version = 1
            mode = "portable"
            data_layout = "relative"
          }
          $PortableManifest | ConvertTo-Json | Out-File -FilePath "$PortableDir\LightC.portable.json" -Encoding utf8
          Write-Host "  Created: LightC.portable.json" -ForegroundColor White

          # DLL files
          $DllFiles = Get-ChildItem -Path $ReleaseDir -Filter "*.dll" -ErrorAction SilentlyContinue
          if ($DllFiles) {
            foreach ($dll in $DllFiles) {
              Copy-Item $dll.FullName $PortableDir -Force
              Write-Host "  Copied: $($dll.Name)" -ForegroundColor White
            }
          }

          # resources directory
          if (Test-Path "$ReleaseDir\resources") {
            Copy-Item "$ReleaseDir\resources" "$PortableDir\resources" -Recurse -Force
            Write-Host "  Copied: resources/" -ForegroundColor White
          }

          # The official download channel is not hard-coded in the frontend; download.json is uploaded with the Release so the netdisk URL can be adjusted later.
          $DownloadConfig = [ordered]@{
            githubReleasesUrl = "https://github.com/Chunyu33/light-c/releases"
            netDiskUrl = "https://pan.quark.cn/s/bce8f722bf33"
            bilibiliUrl = "https://space.bilibili.com/387797235"
            douyinUrl = "https://www.douyin.com/search/Evan%E7%9A%84%E5%83%8F%E7%B4%A0%E7%A9%BA%E9%97%B4"
          }
          $DownloadConfig | ConvertTo-Json | Out-File -FilePath "download.json" -Encoding utf8
          Write-Host "  Created: download.json" -ForegroundColor Green

          # Compression
          Compress-Archive -Path "$PortableDir\*" -DestinationPath $ZipName -Force
          Write-Host "  Created: $ZipName" -ForegroundColor Green

          # The signing target must be the LightC.exe inside the final portable archive; the manifest does not participate in exe signing, avoiding changes to the existing verification chain.
          $SignatureOutput = npx tauri signer sign "$PortableDir\LightC.exe"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: portable exe signing failed" -ForegroundColor Red
            exit $LASTEXITCODE
          }
          $GeneratedSigPath = "$PortableDir\LightC.exe.sig"
          if (Test-Path $GeneratedSigPath) {
            $SignatureText = Get-Content -Raw -Path $GeneratedSigPath
            if ($SignatureText.TrimStart().StartsWith("untrusted comment:")) {
              # The raw minisign text needs to be converted into a Tauri updater-style Public signature string.
              $SignatureBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($SignatureText))
            } else {
              # Some CLI versions write Public signature directly; reusing it avoids double base64.
              $SignatureBase64 = $SignatureText.Trim()
            }
          } else {
            # The CLI normally generates a .sig file; as a fallback, parse Public signature from stdout, to avoid writing explanatory text into the signature asset.
            $SignatureBase64 = ($SignatureOutput -split "`r?`n" | Where-Object { $_ -match '^[A-Za-z0-9+/=]+$' } | Select-Object -Last 1)
            if (-not $SignatureBase64) {
              Write-Host "Error: signature output not found" -ForegroundColor Red
              exit 1
            }
          }
          $SignatureBase64 | Out-File -FilePath "LightC_portable_exe.sig" -Encoding utf8 -NoNewline
          Write-Host "  Created: LightC_portable_exe.sig" -ForegroundColor Green

          # Clean up temporary directory
          Remove-Item $PortableDir -Recurse -Force

          # Output file names for later steps
          echo "portable_zip=$ZipName" >> $env:GITHUB_OUTPUT
        id: portable

      - name: Upload extra assets to release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ZipPath = "LightC_portable_x64_v$env:RELEASE_VERSION.zip"
          $InstallerSigPath = "LightC_installer_exe.sig"
          $WebView2OfflineSigPath = "LightC_webview2_offline_exe.sig"
          $PortableSigPath = "LightC_portable_exe.sig"
          $DownloadConfigPath = "download.json"
          $WebView2OfflineInstallerPath = "LightC_webview2_offline_x64_v$env:RELEASE_VERSION.exe"

          # Generate checksums: the download page must be able to directly verify installer integrity.
          # The local pack.ps1 always generates SHA256SUMS.txt, but online releases go through here, and this step was previously missed.
          # ⚠️ Must write UTF-8 without BOM: a BOM makes `sha256sum -c` fail on the first line.
          $ChecksumTargets = @()
          $ChecksumTargets += Get-ChildItem -Path $ZipPath -File -ErrorAction SilentlyContinue
          $ChecksumTargets += Get-ChildItem -Path $WebView2OfflineInstallerPath -File -ErrorAction SilentlyContinue
          $ChecksumTargets += Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ChecksumTargets.Count -eq 0) {
            Write-Host "Error: no release asset found for checksum generation" -ForegroundColor Red
            exit 1
          }
          $ChecksumLines = [System.Collections.Generic.List[string]]::new()
          foreach ($target in $ChecksumTargets) {
            $hash = (Get-FileHash -Path $target.FullName -Algorithm SHA256).Hash
            # Two spaces are required by the sha256sum format
            $ChecksumLines.Add("$hash  $($target.Name)")
            Write-Host "  $($target.Name)  $hash" -ForegroundColor Gray
          }
          [System.IO.File]::WriteAllLines("SHA256SUMS.txt", $ChecksumLines, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "  Created: SHA256SUMS.txt" -ForegroundColor Green

          if ((Test-Path $ZipPath) -and (Test-Path $InstallerSigPath) -and (Test-Path $WebView2OfflineSigPath) -and (Test-Path $PortableSigPath) -and (Test-Path $DownloadConfigPath) -and (Test-Path $WebView2OfflineInstallerPath) -and (Test-Path "SHA256SUMS.txt")) {
            Write-Host "Uploading extra assets to release..." -ForegroundColor Cyan
            gh release upload ${{ github.ref_name }} $ZipPath $InstallerSigPath $WebView2OfflineSigPath $PortableSigPath $DownloadConfigPath $WebView2OfflineInstallerPath SHA256SUMS.txt --clobber
            Write-Host "Upload done!" -ForegroundColor Green
          } else {
            Write-Host "Error: portable zip, exe signatures, download config, WebView2 offline installer or checksum file not found" -ForegroundColor Red
            exit 1
          }
